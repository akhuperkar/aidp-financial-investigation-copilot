<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="830" viewBox="0 0 1650 830" role="img" aria-label="Actual reference architecture and separate analytical and agent serving paths"><title>Actual reference architecture and separate analytical and agent serving paths</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6C655F"/></marker></defs><rect width="1650" height="830" fill="#F7F5F1"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="54" font-size="34" font-weight="700" fill="#312D2A">A shared data foundation, with explicit serving paths</text><text x="48" y="91" font-size="20" font-weight="400" fill="#6C655F">Meridian Demo Bank  •  Oracle AI Data Platform  •  Read-only investigation</text><rect x="48" y="144" width="315" height="169" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="48" y="160" width="5" height="137" fill="#C74634"/><text x="72" y="186" font-size="25" font-weight="700" fill="#312D2A">Bronze → Silver → Gold</text><text x="72" y="221" font-size="19" font-weight="400" fill="#6C655F">Spark notebooks + Delta</text><text x="72" y="250" font-size="19" font-weight="400" fill="#6C655F">finance.bronze / silver / gold</text><text x="72" y="279" font-size="19" font-weight="400" fill="#6C655F">Analytics + transaction features</text><rect x="475" y="144" width="330" height="169" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="475" y="160" width="5" height="137" fill="#537D6B"/><text x="499" y="186" font-size="25" font-weight="700" fill="#312D2A">Autonomous AI Lakehouse</text><text x="499" y="221" font-size="19" font-weight="400" fill="#6C655F">Two native Oracle Gold tables</text><text x="499" y="250" font-size="19" font-weight="400" fill="#6C655F">Types, JSON and full-row checks</text><text x="499" y="279" font-size="19" font-weight="400" fill="#6C655F">Existing external catalog</text><rect x="920" y="144" width="330" height="169" rx="14" fill="#FFFFFF" stroke