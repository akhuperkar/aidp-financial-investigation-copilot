<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" role="img" aria-label="Supervisor and four executors, seven SQL tools, policy RAG and analyst brief composition"><title>Supervisor and four executors, seven SQL tools, policy RAG and analyst brief composition</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6C655F"/></marker></defs><rect width="1600" height="810" fill="#F7F5F1"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="56" font-size="34" font-weight="700" fill="#312D2A">One question, four specialist roles</text><text x="48" y="95" font-size="23" font-weight="400" fill="#6C655F">Which account should I review, what supports the priority, and which policy applies?</text><rect x="540" y="135" width="520" height="126" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="540" y="151" width="5" height="94" fill="#C74634"/><text x="564" y="177" font-size="25" font-weight="700" fill="#312D2A">Input guardrails → supervisor</text><text x="564" y="212" font-size="19" font-weight="400" fill="#6C655F">Route by request, preserve scope, disclose unavailable facts</text><path d="M800 265 L800 305" fill="none" stroke="#6C655F" stroke-width="3" marker-end="url(#arrow)"/><path d="M218 345 V310 H1382 V345" fill="none" stroke="#6C655F" stroke-width="3"/><rect x="40" y="345" width="335" height="180" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="40" y="361" width="5" height="148" fill="#315F70"/><text x="64" y="387" font-size="25" font-weight="700" fill="#312D2A">Portfolio SQL</text><text x="64" y="422" font-size="19" font-weight="400" fill="#6C655F">Reporting context</text><text x="64" y="451" font-size="19" font-weight="400" fill="#6C655F">Snapshot, trend, exposure mix</text><text x="64" y="480" font-size="19" font-weight="400" fill="#6C655F">4 bounded SQL tools</text><rect x="435" y="345" width="335" height="180" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="435" y="361" width="5" height="148" fill="#315F70"/><text x="459" y="387" font-size="25" font-weight="700" fill="#312D2A">Investigation SQL</text><text x="459" y="422" font-size="19" font-weight="400" fill="#6C655F">Exposure-ranked queue</text><text x="459" y="451" font-size="19" font-weight="400" fill="#6C655F">Account totals + evidence</text><text x="459" y="480" font-size="19" font-weight="400" fill="#6C655F">3 bounded SQL tools</text><rect x="830" y="345" width="335" height="180" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="830" y="361" width="5" height="148" fill="#315F70"/><text x="854" y="387" font-size="25" font-weight="700" fill="#312D2A">Policy RAG</text><text x="854" y="422" font-size="19" font-weight="400" fill="#6C655F">Fictional FS policy</text><text x="854" y="451" font-size="19" font-weight="400" fill="#6C655F">Thresholds + review guidance</text><text x="854" y="480" font-size="19" font-weight="400" fill="#6C655F">Citations and document version</text><rect x="1225" y="345" width="335" height="180" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="1225" y="361" width="5" height="148" fill="#315F70"/><text x="1249" y="387" font-size="25" font-weight="700" fill="#312D2A">Brief composition</text><text x="1249" y="422" font-size="19" font-weight="400" fill="#6C655F">Literal evidence packet</text><text x="1249" y="451" font-size="19" font-weight="400" fill="#6C655F">Prompt tool composes once</text><text x="1249" y="480" font-size="19" font-weight="400" fill="#6C655F">Return Markdown unchanged</text><text x="48" y="606" font-size="27" font-weight="700" fill="#312D2A">Evidence contract</text><rect x="48" y="635" width="365" height="78" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><text x="66" y="681" font-size="19" font-weight="500" fill="#312D2A">Period + snapshot + account</text><rect x="438" y="635" width="365" height="78" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><text x="456" y="681" font-size="19" font-weight="500" fill="#312D2A">Actual SQL totals and rows</text><rect x="828" y="635" width="365" height="78" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><text x="846" y="681" font-size="19" font-weight="500" fill="#312D2A">Retrieved policy and citations</text><rect x="1218" y="635" width="365" height="78" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><text x="1236" y="681" font-size="19" font-weight="500" fill="#312D2A">Gaps, caps and review status</text><text x="48" y="774" font-size="20" font-weight="400" fill="#6C655F">Human review remains outside the flow. This configuration has no external-action tools or implemented approval gate.</text></g></svg>