<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-label="Bronze, Silver and Gold data responsibilities and metric contract"><title>Bronze, Silver and Gold data responsibilities and metric contract</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6C655F"/></marker></defs><rect width="1600" height="680" fill="#F7F5F1"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="54" font-size="34" font-weight="700" fill="#312D2A">Curate once. Reuse at the right grain.</text><rect x="48" y="134" width="456" height="270" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="48" y="150" width="5" height="238" fill="#9A6C45"/><text x="72" y="176" font-size="25" font-weight="700" fill="#312D2A">BRONZE</text><text x="72" y="211" font-size="19" font-weight="400" fill="#6C655F">Raw transactions</text><text x="72" y="240" font-size="19" font-weight="400" fill="#6C655F">Account • time • amount</text><text x="72" y="269" font-size="19" font-weight="400" fill="#6C655F">Type • merchant • location</text><text x="72" y="298" font-size="19" font-weight="400" fill="#6C655F">Keep a reference for processing</text><rect x="572" y="134" width="456" height="270" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="572" y="150" width="5" height="238" fill="#748186"/><text x="596" y="176" font-size="25" font-weight="700" fill="#312D2A">SILVER</text><text x="596" y="211" font-size="19" font-weight="400" fill="#6C655F">Validated transaction rows</text><text x="596" y="240" font-size="19" font-weight="400" fill="#6C655F">Required-field checks</text><text x="596" y="269" font-size="19" font-weight="400" fill="#6C655F">Time-derived features</text><text x="596" y="298" font-size="19" font-weight="400" fill="#6C655F">Consistent inputs</text><rect x="1096" y="134" width="456" height="270" rx="14" fill="#FFFFFF" stroke="#D9D3CC"/><rect x="1096" y="150" width="5" height="238