name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/app.txt
      - run: python -m pip install -r requirements/app.txt
      - run: python -m unittest discover -s validation -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -v
        working-directory: apps/copilot
      - run: python scripts/check_publication.py
