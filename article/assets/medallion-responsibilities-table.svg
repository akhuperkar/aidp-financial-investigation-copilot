<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="577" viewBox="0 0 1000 577" role="img" aria-labelledby="title description">
<title id="title">Data layer responsibilities</title>
<desc id="description">Layer | Responsibility in this demonstration | Downstream value; Bronze | Retain generated transaction records | A reference for the transformation path; Silver | Check required fields and derive time features | Consistent inputs for subsequent processing; Gold | Produce account-month analytics and transaction-level ML features | Reusable analytical and modelling inputs</desc>
<rect width="1000" height="577" fill="#FFFFFF"/>
<rect x="24" y="24" width="952" height="5" fill="#C74634"/>
<rect x="24" y="29" width="952" height="112" fill="#312D2A"/>
<text x="44" y="94.0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">
<tspan x="44" dy="0">Layer</tspan>
</text>
<text x="194" y="75.0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">
<tspan x="194" dy="0">Responsibility in this</tspan>
<tspan x="194" dy="38">demonstration</tspan>
</text>
<text x="594" y="94.0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">
<tspan x="594" dy="0">Downstream value</tspan>
</text>
<rect x="24" y="141" width="952" height="112" fill="#FFFFFF"/>
<text x="44" y="206.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="44" dy="0">Bronze</tspan>
</text>
<text x="194" y="187.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="194" dy="0">Retain generated</tspan>
<tspan x="194" dy="38">transaction records</tspan>
</text>
<text x="594" y="187.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="594" dy="0">A reference for the</tspan>
<tspan x="594" dy="38">transformation path</tspan>
</text>
<path d="M 24 253 H 976" stroke="#DEDbd8"/>
<rect x="24" y="253" width="952" height="112" fill="#F8F9FA"/>
<text x="44" y="318.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="44" dy="0">Silver</tspan>
</text>
<text x="194" y="299.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="194" dy="0">Check required fields and</tspan>
<tspan x="194" dy="38">derive time features</tspan>
</text>
<text x="594" y="299.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="594" dy="0">Consistent inputs for</tspan>
<tspan x="594" dy="38">subsequent processing</tspan>
</text>
<path d="M 24 365 H 976" stroke="#DEDbd8"/>
<rect x="24" y="365" width="952" height="188" fill="#FFFFFF"/>
<text x="44" y="468.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="44" dy="0">Gold</tspan>
</text>
<text x="194" y="411.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="194" dy="0">Produce account-month</tspan>
<tspan x="194" dy="38">analytics and</tspan>
<tspan x="194" dy="38">transaction-level ML</tspan>
<tspan x="194" dy="38">features</tspan>
</text>
<text x="594" y="449.0" fill="#312D2A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">
<tspan x="594" dy="0">Reusable analytical and</tspan>
<tspan x="594" dy="38">modelling inputs</tspan>
</text>
<path d="M 24 553 H 976" stroke="#DEDbd8"/>
</svg>
